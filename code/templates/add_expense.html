{% extends "base.html" %}

{% block content %}

<div class="card">
    <div class="card-header">
        <div>
            <div class="card-title">Add New Expense</div>
            <div class="card-subtitle">
                Log a new transaction with amount, category, and optional note.
            </div>
        </div>
    </div>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('add_expense') }}">
        <div>
            <label for="date">Date (YYYY-MM-DD)</label>
            <input type="text" id="date" name="date" placeholder="2025-12-04">
            <small>Leave blank to use today’s date automatically.</small>
        </div>

        <div class="inline-row" style="margin-top: 14px;">
            <div>
                <label for="amount">Amount</label>
                <input type="text" id="amount" name="amount" placeholder="12.50">
            </div>

            <div>
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="">-- Select Category --</option>
                    <option value="Food">Food</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Travel">Travel</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div style="margin-top: 14px;">
            <label for="note">Note (optional)</label>
            <input type="text" id="note" name="note" placeholder="e.g., coffee with friends">
        </div>

        <div style="margin-top: 18px; display: flex; gap: 10px;">
            <button type="submit">Save Expense</button>
            <a href="{{ url_for('index') }}" class="button-link">
                <button type="button" class="btn-secondary">Cancel</button>
            </a>
        </div>
    </form>
</div>

{% endblock %}
